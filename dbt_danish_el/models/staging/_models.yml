models:
  - name: stg_day_ahead_prices
    columns:
      - name: time_utc
        data_tests:
          - not_null
      - name: price_area
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SE3', 'NO2', 'DK1', 'SE4', 'DE', 'DK2']
      - name: day_ahead_price_eur
        data_tests:
          - not_null
      - name: day_ahead_price_dkk
        data_tests:
          - not_null
