models:
  - name: cleanest_hour_comparison
    columns:
      - name: price_area
        data_tests:
        - not_null
        - accepted_values:
            arguments:
              values: ['DK1', 'DK2']
      - name: day_type
        data_tests:
        - not_null
        - accepted_values:
            arguments:
              values: ['weekday', 'weekend']
      - name: hour
        data_tests:
          - not_null
      - name: avg_co2_emission
        data_tests:
          - not_null
      - name: co2_rank
        data_tests:
          - not_null
      - name: avg_price
        data_tests:
          - not_null
      - name: cheapest_price_by_hour_rank
        data_tests:
          - not_null
      - name: co2_minus_price_rank
        data_tests:
          - not_null
